name: Dependency graph

# Publish the resolved Gradle graph for repository advisories and dependency alerts.
# The build has a read-only token; a separate job submits the graph without running build code.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Generate the resolved dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-upload

  submit:
    name: Submit dependency graph
    needs: dependency-graph
    runs-on: ubuntu-26.04
    permissions:
      # The dependency submission API needs write access; this job runs no build code.
      contents: write

    steps:
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
