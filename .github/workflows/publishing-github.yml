name: Publishing GitHub Packages

# Publishing split from building: `prepare` builds and stages with a read-only token, `publish` uploads exactly the
# staged files with the write token and runs no Gradle and no repository code, `verify` consumes the result from
# GitHub Packages. GitHub Packages generates all maven-metadata.xml itself from the uploaded files (a PUT of one is
# accepted and ignored), so only artifacts and their checksums are uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

# Versions share the coordinate-level maven-metadata.xml: one run of this workflow at a time. It doesn't serialize
# against publishing from elsewhere (another workflow or a local `./gradlew publish`).
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: https://maven.pkg.github.com/${{ github.repository }}
  # The coordinates this repository publishes, as repository paths.
  COORDINATES: io/github/leanish/sqs-codec
  # The files each coordinate must publish, as suffixes after `<artifact>-<version>`. publish requires exactly these,
  # each with its .md5/.sha1/.sha256/.sha512, plus a SNAPSHOT's version metadata: nothing else.
  FILES_LIBRARY: .jar -sources.jar -javadoc.jar .pom .module

jobs:
  check-java-25:
    name: Checking on JDK 25
    uses: ./.github/workflows/ci.yml

  test-legacy-jdk:
    name: Testing on Legacy JDKs
    uses: ./.github/workflows/testing-legacy-jdk.yml

  prepare:
    name: Build and stage
    needs:
      - check-java-25
      - test-legacy-jdk
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # To read the current remote metadata; Gradle never sees a write token.
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      # One hand-over per attempt: a re-run of prepare makes a new one and never replaces the one a partial publish
      # needs to complete; a re-run of publish alone keeps downloading the attempt it started from.
      handover: publication-${{ github.run_attempt }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Read the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          properties=$(./gradlew -q properties --property version)
          lines=$(printf '%s\n' "$properties" | grep -E '^version: ' || true)
          [ "$(printf '%s\n' "$lines" | grep -c .)" = 1 ] || { echo "::error::expected one version line, got: $lines"; exit 1; }
          version="${lines#version: }"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "::error::unexpected version: $version"; exit 1; }
          # A release is published only from its tag, and a tag only publishes the version it names.
          if [[ "$version" != *-SNAPSHOT || "$REF_TYPE" = tag ]] && [ "$REF_TYPE/$REF_NAME" != "tag/v$version" ]; then
            echo "::error::$version must be dispatched from tag v$version, not $REF_TYPE $REF_NAME"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"

      # Records the versions the registry lists now, so verify can check none is lost. For a SNAPSHOT, seeds its version
      # metadata so Gradle continues the remote build number (Gradle merges a file repository's existing metadata), and
      # records the remote snapshot (timestamp-build) so publish can refuse to put an older build over a newer one.
      - name: Read the remote metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          staging=build/publication-staging
          rm -rf "${staging:?}"
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          : > "$RUNNER_TEMP/before.txt"
          : > "$RUNNER_TEMP/seeded.txt"
          fetch() { curl -sS -L --retry 3 -o "$RUNNER_TEMP/remote" -w '%{http_code}' -H @"$auth" "$REGISTRY/$1"; }
          for coordinate in $COORDINATES; do
            status=$(fetch "$coordinate/maven-metadata.xml")
            case "$status" in
              200) python3 -I -c 'import sys, xml.etree.ElementTree as ET
          for v in ET.parse(sys.argv[1]).getroot().findall("versioning/versions/version"):
              print(sys.argv[2], (v.text or "").strip())' "$RUNNER_TEMP/remote" "$coordinate" >> "$RUNNER_TEMP/before.txt" ;;
              404) echo "no versions yet for $coordinate" ;;
              *) echo "::error::GET $coordinate/maven-metadata.xml returned $status"; exit 1 ;;
            esac
            [[ "$VERSION" == *-SNAPSHOT ]] || continue
            path="$coordinate/$VERSION/maven-metadata.xml"
            status=$(fetch "$path")
            case "$status" in
              200) mkdir -p "$staging/$(dirname "$path")"; cp "$RUNNER_TEMP/remote" "$staging/$path"; echo "seeded $path"
                   printf '%s %s\n' "$(python3 -I -c 'import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot().find("versioning/snapshot")
          print("%s-%s" % (s.findtext("timestamp").strip(), s.findtext("buildNumber").strip()))' "$staging/$path")" "$path" >> "$RUNNER_TEMP/seeded.txt" ;;
              404) echo "absent $path"; printf 'absent %s\n' "$path" >> "$RUNNER_TEMP/seeded.txt" ;;
              *) echo "::error::GET $path returned $status"; exit 1 ;;
            esac
          done
          cat "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/seeded.txt"

      # The checks ran in the jobs above (ci.yml's `build` includes `check`).
      - name: Stage the publications
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Write the manifest and summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          staging=build/publication-staging
          [ -z "$(find "$staging" -type l)" ] || { echo "::error::staging contains symlinks"; exit 1; }
          # The registry generates coordinate metadata itself: Gradle's local copy isn't handed over.
          for coordinate in $COORDINATES; do rm -f "${staging:?}/${coordinate:?}"/maven-metadata.xml*; done
          mkdir -p "$RUNNER_TEMP/handover"
          cp -R "$staging" "$RUNNER_TEMP/handover/files"
          cp "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/seeded.txt" "$RUNNER_TEMP/handover/"
          (cd "$RUNNER_TEMP/handover/files" && find . -type f -printf '%P\n' | LC_ALL=C sort | xargs -r -d '\n' sha256sum) > "$RUNNER_TEMP/handover/manifest.txt"
          {
            echo "### Prepared $VERSION from $REF ($SHA)"
            echo
            echo "Coordinates: $COORDINATES"
            echo
            echo '```'
            cat "$RUNNER_TEMP/handover/manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the hand-over
        id: handover
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handover
          if-no-files-found: error
          # Long enough to re-run publish with the same files after a partial upload.
          retention-days: 30

      - name: Identify the hand-over
        env:
          ARTIFACT_ID: ${{ steps.handover.outputs.artifact-id }}
        run: |
          echo "Hand-over artifact id: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-artifacts
          path: |
            build/test-results/**
            build/reports/**
            build/publications/**

  publish:
    name: Publish to GitHub Packages
    needs: prepare
    runs-on: ubuntu-26.04
    # Only the upload: no checkout, no Gradle, no cache; the files come from prepare's artifact.
    permissions:
      packages: write
    steps:
      - name: Download the hand-over
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.handover }}
          path: ${{ runner.temp }}/handover

      - name: Verify the hand-over
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          cd "$RUNNER_TEMP/handover/files"
          [ -z "$(find . -type l)" ] || { echo "::error::the hand-over contains symlinks"; exit 1; }
          grep -qvE '^[0-9a-f]{64}  [^ /][^ ]*$' ../manifest.txt && { echo "::error::malformed manifest line"; exit 1; }
          sha256sum --quiet --strict -c ../manifest.txt
          # Every file is in the manifest, exactly once.
          diff <(find . -type f -printf '%P\n' | LC_ALL=C sort) <(cut -d' ' -f3- ../manifest.txt) > /dev/null \
            || { echo "::error::files and manifest differ"; exit 1; }
          [ "$(cut -d' ' -f3- ../manifest.txt | sort | uniq -d)" = "" ] || { echo "::error::duplicate paths"; exit 1; }
          # The exact set this version must publish, built from the coordinates (not from the list of files handed over):
          # a missing publication or an extra path fails. A SNAPSHOT's file version comes from its handed-over version
          # metadata.
          snapshot_field() {
            python3 -I -c 'import sys, xml.etree.ElementTree as ET
          print((ET.parse(sys.argv[1]).getroot().findtext("versioning/snapshot/" + sys.argv[2]) or "").strip())' "$1" "$2"
          }
          expected="$RUNNER_TEMP/expected.txt"
          : > "$expected"
          with_sidecars() { for suffix in "" .md5 .sha1 .sha256 .sha512; do printf '%s%s\n' "$1" "$suffix" >> "$expected"; done; }
          for coordinate in $COORDINATES; do
            artifact="${coordinate##*/}"
            files="$FILES_LIBRARY"
            [[ "$artifact" == *.gradle.plugin ]] && files="${FILES_MARKER:?}"
            file_version="$VERSION"
            if [[ "$VERSION" == *-SNAPSHOT ]]; then
              metadata="$coordinate/$VERSION/maven-metadata.xml"
              [ -f "$metadata" ] || { echo "::error::missing $metadata"; exit 1; }
              timestamp=$(snapshot_field "$metadata" timestamp)
              build=$(snapshot_field "$metadata" buildNumber)
              [[ "$timestamp" =~ ^[0-9]{8}\.[0-9]{6}$ && "$build" =~ ^[0-9]+$ ]] || { echo "::error::no snapshot timestamp in $metadata"; exit 1; }
              file_version="${VERSION%-SNAPSHOT}-$timestamp-$build"
              with_sidecars "$metadata"
            fi
            for suffix in $files; do with_sidecars "$coordinate/$VERSION/$artifact-$file_version$suffix"; done
          done
          diff <(LC_ALL=C sort "$expected") <(cut -d' ' -f3- ../manifest.txt | LC_ALL=C sort) \
            || { echo "::error::the hand-over isn't exactly the expected files (diff above: < missing, > unexpected)"; exit 1; }
          grep -qvE '^(absent|[0-9]{8}\.[0-9]{6}-[0-9]+) [^ /][^ ]*$' ../seeded.txt && { echo "::error::malformed seeded line"; exit 1; }
          diff <(grep -E '/maven-metadata\.xml$' "$expected" | LC_ALL=C sort) <(cut -d' ' -f2- ../seeded.txt | LC_ALL=C sort) \
            || { echo "::error::seeded.txt doesn't cover exactly the SNAPSHOT version metadata"; exit 1; }
          grep -qvE '^[^ /][^ ]* [0-9A-Za-z.+-]+$' ../before.txt && { echo "::error::malformed before line"; exit 1; }
          echo "hand-over verified: $(wc -l < ../manifest.txt) files"

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/handover/files"
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          remote="$RUNNER_TEMP/remote"
          # GET follows redirects (downloads may be served from storage; curl drops the header on another host).
          # PUTs aren't retried (a re-run of this job with the same artifact recovers).
          get() { curl -sS -L --retry 3 -o "$remote" -w '%{http_code}' -H @"$auth" "$REGISTRY/$1"; }
          put() {
            local status
            status=$(curl -sS -o "$RUNNER_TEMP/put-body" -w '%{http_code}' -X PUT -H @"$auth" --data-binary @"$1" "$REGISTRY/$1")
            echo "PUT $1 -> $status"
            [[ "$status" == 2?? ]] || { echo "::error::PUT $1 returned $status: $(head -c 500 "$RUNNER_TEMP/put-body")"; exit 1; }
            status=$(get "$1")
            [ "$status" = 200 ] && cmp -s "$remote" "$1" || { echo "::error::after PUT, GET $1 returned $status or other bytes"; exit 1; }
          }
          is_metadata() { [[ "$1" =~ /maven-metadata\.xml(\.(md5|sha1|sha256|sha512))?$ ]]; }
          identity() { python3 -I -c 'import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot().find("versioning/snapshot")
          print("%s-%s" % (s.findtext("timestamp").strip(), s.findtext("buildNumber").strip()))' "$1"; }

          # Before writing anything: a SNAPSHOT's latest build on the registry must still be the one prepare seeded (a
          # fresh publish) or this one (a retry), so an older build can't become the latest over a newer one. The
          # registry rebuilds the XML from the files, so builds are compared, not bytes.
          while read -r seeded path; do
            status=$(get "$path")
            case "$status" in
              200) now=$(identity "$remote") ;;
              404) now=absent ;;
              *) echo "::error::GET $path returned $status"; exit 1 ;;
            esac
            [ "$now" = "$seeded" ] || [ "$now" = "$(identity "$path")" ] \
              || { echo "::error::$path is at build $now, seeded $seeded: a newer build exists, prepare again"; exit 1; }
          done < ../seeded.txt

          mapfile -t files < <(cut -d' ' -f3- ../manifest.txt)
          # Artifacts and their checksums are immutable: identical → skip, different → fail, absent → upload. Once
          # some of a version's files are up, only a re-run of this job with the same artifact completes it: a rebuild
          # with other bytes is refused here. Metadata and its checksums are never uploaded.
          for path in "${files[@]}"; do
            is_metadata "$path" && continue
            status=$(get "$path")
            case "$status" in
              200) cmp -s "$remote" "$path" && { echo "same $path"; continue; }
                   echo "::error::$path already exists with other bytes"; exit 1 ;;
              404) put "$path" ;;
              *) echo "::error::GET $path returned $status"; exit 1 ;;
            esac
          done
          echo "done; the registry generates the Maven metadata from these files"

  verify:
    name: Verify the published version
    needs:
      - prepare
      - publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Download the hand-over
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.handover }}
          path: ${{ runner.temp }}/handover

      # Each coordinate still lists every version it listed before, plus this one; a SNAPSHOT's latest build is the one
      # prepared, and the newest entry of each of its files is that build (earlier builds stay listed).
      - name: Check the remote metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          handover="$RUNNER_TEMP/handover"
          auth="$RUNNER_TEMP/auth-header"
          (umask 077; printf 'Authorization: Bearer %s\n' "$GITHUB_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          # Reads Maven metadata with an XML parser (the registry serves it on one line).
          meta() {
            python3 -I -c 'import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if sys.argv[2] == "versions":
              for v in root.findall("versioning/versions/version"):
                  print((v.text or "").strip())
          elif sys.argv[2] == "identity":
              s = root.find("versioning/snapshot")
              print("%s-%s" % (s.findtext("timestamp").strip(), s.findtext("buildNumber").strip()))
          elif sys.argv[2] == "newest":
              # The newest value per (extension, classifier), ordered by (timestamp, build number as a number).
              def order(value):
                  m = re.search(r"-(\d{8}\.\d{6})-(\d+)$", value)
                  return (m.group(1), int(m.group(2))) if m else ("", -1)
              newest = {}
              for v in root.findall("versioning/snapshotVersions/snapshotVersion"):
                  key = (v.findtext("extension", "").strip(), v.findtext("classifier", "").strip())
                  value = v.findtext("value", "").strip()
                  if key not in newest or order(value) > order(newest[key]):
                      newest[key] = value
              for key in sorted(newest):
                  print(newest[key])
          else:
              sys.exit("unknown field " + sys.argv[2])' "$1" "$2"
          }
          metadata="$RUNNER_TEMP/metadata.xml"
          for coordinate in $COORDINATES; do
            echo "== $coordinate"
            curl -sS -L -f --retry 3 -H @"$auth" -o "$metadata" "$REGISTRY/$coordinate/maven-metadata.xml"
            meta "$metadata" versions | LC_ALL=C sort -u > "$RUNNER_TEMP/listed"
            { awk -v c="$coordinate" '$1 == c { print $2 }' "$handover/before.txt"; echo "$VERSION"; } | LC_ALL=C sort -u > "$RUNNER_TEMP/wanted"
            missing=$(LC_ALL=C comm -23 "$RUNNER_TEMP/wanted" "$RUNNER_TEMP/listed")
            [ -z "$missing" ] || { echo "::error::$coordinate no longer lists: $missing"; exit 1; }
            echo "lists: $(tr '\n' ' ' < "$RUNNER_TEMP/listed")"
            [[ "$VERSION" == *-SNAPSHOT ]] || continue
            prepared="$handover/files/$coordinate/$VERSION/maven-metadata.xml"
            curl -sS -L -f --retry 3 -H @"$auth" -o "$metadata" "$REGISTRY/$coordinate/$VERSION/maven-metadata.xml"
            build=$(meta "$prepared" identity)
            [ "$(meta "$metadata" identity)" = "$build" ] || { echo "::error::$coordinate's latest build isn't $build"; exit 1; }
            value="${VERSION%-SNAPSHOT}-$build"
            meta "$metadata" newest > "$RUNNER_TEMP/values"
            [ -s "$RUNNER_TEMP/values" ] && ! grep -qvxF "$value" "$RUNNER_TEMP/values" \
              || { echo "::error::$coordinate: the newest snapshotVersions aren't all $value"; cat "$RUNNER_TEMP/values"; exit 1; }
            echo "latest build: $build"
          done

      # A consumer resolves the library from scratch, once through Gradle module metadata and once through the POM, each
      # with its own Gradle home. Only GitHub Packages may provide sqs-codec; its dependencies come from Maven Central.
      - name: Consume the published version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "::error::unexpected version: $VERSION"; exit 1; }
          expected="io.github.leanish:sqs-codec:$VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            expected="$expected:$(python3 -I -c 'import sys, xml.etree.ElementTree as ET
          s = ET.parse(sys.argv[1]).getroot().find("versioning/snapshot")
          print("%s-%s" % (s.findtext("timestamp").strip(), s.findtext("buildNumber").strip()))' "$RUNNER_TEMP/handover/files/io/github/leanish/sqs-codec/$VERSION/maven-metadata.xml")"
          fi
          for source in gradle pom; do
            echo "== metadata source: $source"
            consumer="$RUNNER_TEMP/consumer-$source"
            mkdir "$consumer"
            echo 'rootProject.name = "consumer"' > "$consumer/settings.gradle.kts"
            # Generated so the version and metadata source are literals (both validated above).
            cat > "$consumer/build.gradle.kts" <<EOF
          plugins {
              java
          }

          repositories {
              exclusiveContent {
                  forRepository {
                      maven {
                          url = uri(System.getenv("REGISTRY"))
                          if (url.scheme == "https") {
                              credentials {
                                  username = System.getenv("GITHUB_ACTOR")
                                  password = System.getenv("GITHUB_TOKEN")
                              }
                          }
                          metadataSources {
                              if ("$source" == "gradle") {
                                  gradleMetadata()
                              } else {
                                  mavenPom()
                                  ignoreGradleMetadataRedirection()
                              }
                          }
                      }
                  }
                  filter { includeModule("io.github.leanish", "sqs-codec") }
              }
              mavenCentral()
          }

          dependencies {
              implementation("io.github.leanish:sqs-codec:$VERSION")
          }

          tasks.register("resolvedComponents") {
              val resolved = configurations.runtimeClasspath.map { classpath ->
                  classpath.incoming.artifacts.artifacts.map { "\${it.id.componentIdentifier.displayName} \${it.file.name}" }
              }
              doLast { resolved.get().forEach { println("resolved: \$it") } }
          }
          EOF
            GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home-$source" ./gradlew -p "$consumer" --no-configuration-cache \
              resolvedComponents | tee "$RUNNER_TEMP/consumer.log"
            grep -qF "resolved: $expected sqs-codec-" "$RUNNER_TEMP/consumer.log" || { echo "::error::didn't resolve $expected"; exit 1; }
          done
