name: Publishing GitHub Packages

# Checks, then publishes through java-conventions' reusable workflow, which keeps Gradle away from the write token.

on:
  workflow_dispatch:

permissions:
  contents: read

# Versions share the coordinate-level maven-metadata.xml: one run of this workflow at a time. It doesn't serialize
# against publishing from elsewhere (another workflow or a local `./gradlew publish`). `queue: max` keeps up to 100
# waiting runs instead of only the latest, so a later dispatch doesn't cancel a pending release publish.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  check-java-25:
    name: Checking on JDK 25
    uses: ./.github/workflows/ci.yml

  test-legacy-jdk:
    name: Testing on Legacy JDKs
    uses: ./.github/workflows/testing-legacy-jdk.yml

  publish:
    name: Publish
    needs:
      - check-java-25
      - test-legacy-jdk
    # The most the reusable workflow's jobs get; each narrows it.
    permissions:
      contents: read
      packages: write
    uses: leanish/java-conventions/.github/workflows/publishing-github-packages.yml@06c253432b0c7fbbf195033558e8a483c4b04047 # v0.7.0
    with:
      coordinates: io/github/leanish/sqs-codec
