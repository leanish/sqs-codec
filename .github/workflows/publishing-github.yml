name: Publishing GitHub Packages

# Checks, then publishes through java-conventions' reusable workflow, which keeps Gradle away from the write token.

on:
  workflow_dispatch:

permissions:
  contents: read

# Versions share the coordinate-level maven-metadata.xml: one run of this workflow at a time. It doesn't serialize
# against publishing from elsewhere (another workflow or a local `./gradlew publish`).
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-java-25:
    name: Checking on JDK 25
    uses: ./.github/workflows/ci.yml

  test-legacy-jdk:
    name: Testing on Legacy JDKs
    uses: ./.github/workflows/testing-legacy-jdk.yml

  publish:
    name: Publish
    needs:
      - check-java-25
      - test-legacy-jdk
    # The most the reusable workflow's jobs get; each narrows it.
    permissions:
      contents: read
      packages: write
    uses: leanish/java-conventions/.github/workflows/publishing-github-packages.yml@b4c890455eff18cf46ba876ca6e9e6def5598728 # v0.6.4
    with:
      coordinates: io/github/leanish/sqs-codec
