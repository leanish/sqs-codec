name: supply-chain

# The supply-chain gate (leanish/supply-chain): on a PR, compares base and head against one advisory snapshot; on
# pushes to main and daily, scans main. See https://github.com/leanish/supply-chain/blob/main/packages/ci/README.md.

on:
  pull_request:
    # `edited` covers a retargeted base, which changes what the gate compares against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # an odd minute: GitHub delays or drops scheduled runs on the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@fab31b9593bc1af1b1844f5da40c1d1e4cc3e547 # v0.8.1
    permissions:
      contents: read
    with:
      java-version: "25"
